issueTrackerURL = "https://github.com/Pikaahhh/cobblemon-hyperspace-wormholes/issues"

[[mods]]
modId = "hyperspace_wormholes"
version = "${version}"
displayName = "Cobblemon: Hyperspace & Wormholes"
authors = "Pikaahhh"
logoFile = "assets/hyperspace_wormholes/icon.png"
description = '''
Hyperspace: the Mega Dimension from Pokemon Legends: ZA, with donut making, hyperspace based on your world and a new way to obtain legendary Pokemon. Wormholes: the Ultra Warp Ride from Pokemon Ultra Sun & Ultra Moon; open a wormhole, fly into it on Solgaleo, Lunala or Necrozma, and race through Ultra Space past wormholes of varying rarity.
'''

