plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The mod is two halves (hyperspace, wormholes) plus usum (the Solgaleo / Lunala / Necrozma signature move animations
// and the boss turning), each with its own code and resources. src/main holds the @Mod class and neoforge.mods.toml.
sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'hyperspace/src/main/java', 'wormholes/src/main/java', 'usum/src/main/java']
        resources.srcDirs = ['src/main/resources', 'hyperspace/src/main/resources', 'wormholes/src/main/resources',
                             'usum/src/main/resources']
    }
    // Stand-ins for the few Jade API types the wormholes half's Jade plugin names; compiled against, never packaged.
    jadeApi {
        java.srcDirs = ['wormholes/src/jadeApi/java']
        resources.srcDirs = []
    }
}

neoForge {
    version = project.neo_version

    mods {
        hyperspace_wormholes {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

dependencies {
    // Cobblemon and CobbleNav are only needed at compile time; we only compile against them.
    compileOnly("com.cobblemon:neoforge:${project.cobblemon_version}") { transitive = false }
    compileOnly("maven.modrinth:cobblemon-pokenav:qbUwxhni") { transitive = false }  // CobbleNav 2.4.1
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
    compileOnly sourceSets.jadeApi.output
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [version: project.version, minecraft_version: project.minecraft_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
